<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="مزرعة إلين Eline Farm Dz: تربية الأغنام وأضاحي العيد والأعلاف والمنتجات الفلاحية بالجملة. اطلب عبر واتساب.">
<title>Eline Farm Dz | مزرعة إلين</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap">
<style>
:root{--bg:#F4EFE4;--fg:#1f2a1d;--mut:#5f6656;--card:#e8e0cf;--bd:#d3c9b3;--ac:#3F5D3A;--on:#F4EFE4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a12;--fg:#F4EFE4;--mut:#b5b09f;--card:#1f281c;--bd:#33402f;--ac:#8DB07F;--on:#141a12}}
:root[data-theme="dark"]{--bg:#141a12;--fg:#F4EFE4;--mut:#b5b09f;--card:#1f281c;--bd:#33402f;--ac:#8DB07F;--on:#141a12}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.7 Tajawal,"Segoe UI",Tahoma,sans-serif}
.w{max-width:640px;margin:0 auto;padding:0 16px 40px}
h1{font-size:30px;font-weight:800;margin:28px 0 2px;line-height:1.3}
.tag{color:var(--mut);margin:0 0 18px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px}
.cats button{flex:none;border:1px solid var(--bd);background:none;color:var(--fg);padding:6px 16px;border-radius:99px;font:inherit;cursor:pointer}
.cats button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.it{display:grid;grid-template-columns:116px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--bd)}
.im{width:116px;height:116px;border-radius:6px;background:var(--card);object-fit:cover;display:block}
.it h2{font-size:18px;margin:0;line-height:1.4}
.it p{margin:2px 0;color:var(--mut);font-size:14px}
.pr{font-weight:800;font-size:17px}
.go{display:inline-block;margin-top:6px;background:var(--ac);color:var(--on);text-decoration:none;padding:8px 16px;border-radius:6px;font-weight:700;border:0;font-family:inherit;font-size:15px;cursor:pointer}
.go.off{background:var(--card);color:var(--mut);cursor:default}
.own{border:2px solid var(--ac);border-radius:8px;padding:14px;margin:0 0 20px}
.own h3{margin:6px 0}
.own label{display:block;font-size:14px;margin:8px 0 2px}
.own input[type=text],.own input[type=tel],.own textarea{width:100%;padding:9px;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px}
.own .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sm{background:none;border:1px solid var(--bd);color:var(--fg);padding:3px 12px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer;margin-inline-end:6px}
#msg{color:var(--ac);font-weight:700;margin-top:8px}
.em{color:var(--mut);padding:30px 0;text-align:center}
.ft{border-top:1px solid var(--bd);padding:18px 0;font-size:14px;color:var(--mut)}.ft a{color:var(--ac);margin-inline-end:14px;font-weight:700}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script id="d" type="application/json">{"shop":"مزرعة إلين","tag":"Eline Farm Dz: تربية الأغنام والمنتجات الفلاحية بالجملة","wa":"213698777750","items":[{"id":"p1","name":"خرفان العيد","cat":"أضاحي العيد","price":"","desc":"بيع على القدم من المربي مباشرة دون وسيط، سلالات نقية، رعاية صحية وتغذية مدروسة. يُسلَّم الخروف في نقطة البيع أو في المزرعة.","img":"","ok":true},{"id":"p2","name":"عجول العيد","cat":"أضاحي العيد","price":"","desc":"عجول مخصصة لأضحية العيد، تُباع مباشرة من المزرعة.","img":"","ok":true},{"id":"p3","name":"كباش وعجول للمناسبات","cat":"مناسبات","price":"","desc":"تُجهَّز حسب الطلب للأعراس والختان والعزاء والحج.","img":"","ok":true},{"id":"p4","name":"التسمين طوال السنة","cat":"التسمين","price":"","desc":"تسمين الأغنام على مدار السنة. اسأل عن التفاصيل عبر واتساب.","img":"","ok":true},{"id":"p5","name":"الفصة","cat":"الأعلاف","price":"","desc":"علف طبيعي متوفر طوال السنة.","img":"","ok":true},{"id":"p6","name":"الشعير","cat":"الأعلاف","price":"","desc":"علف طبيعي متوفر طوال السنة.","img":"","ok":true},{"id":"p7","name":"البرسيم","cat":"الأعلاف","price":"","desc":"علف طبيعي متوفر طوال السنة.","img":"","ok":true},{"id":"p8","name":"العنب (مسكات)","cat":"منتجات فلاحية بالجملة","price":"","desc":"جودة ممتازة، أصل إسباني، بيع بالجملة فقط.","img":"","ok":true},{"id":"p9","name":"الخوخ","cat":"منتجات فلاحية بالجملة","price":"","desc":"بيع بالجملة فقط.","img":"","ok":true},{"id":"p10","name":"الرمان","cat":"منتجات فلاحية بالجملة","price":"","desc":"بيع بالجملة فقط.","img":"","ok":true},{"id":"p11","name":"خضروات متنوعة","cat":"منتجات فلاحية بالجملة","price":"","desc":"بصل وثوم وطماطم وغيرها، بيع بالجملة فقط.","img":"","ok":true},{"id":"p12","name":"الزيتون","cat":"منتجات فلاحية بالجملة","price":"","desc":"لإنتاج زيت الزيتون، بيع بالجملة فقط.","img":"","ok":true}]}</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent);
let cat='الكل';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const link=it=>'https://wa.me/'+D.wa.replace(/\D/g,'')+'?text='+encodeURIComponent('مرحباً، أريد طلب: '+it.name+(it.price?' ('+it.price+')':''));
function card(i){
  const b=!i.ok?'<span class="go off">غير متوفر</span>':(D.wa?'<a class="go" href="'+link(i)+'">اطلب عبر واتساب</a>':'');
  return '<div class="it"><div>'+(i.img?'<img class="im" loading="lazy" src="'+esc(i.img)+'" alt="'+esc(i.name)+'">':'<div class="im"></div>')+'</div><div><h2>'+esc(i.name)+'</h2>'+(i.desc?'<p>'+esc(i.desc)+'</p>':'')+(i.price?'<div class="pr">'+esc(i.price)+'</div>':'')+b+'</div></div>';
}
function render(){
  const cats=['الكل',...new Set(D.items.map(i=>i.cat).filter(Boolean))];
  const list=D.items.filter(i=>cat==='الكل'||i.cat===cat);
  let h='<h1>'+esc(D.shop)+'</h1><p class="tag">'+esc(D.tag)+'</p>';
  if(cats.length>2)h+='<div class="cats">'+cats.map(c=>'<button data-c="'+esc(c)+'"'+(c===cat?' class="on"':'')+'>'+esc(c)+'</button>').join('')+'</div>';
  h+=list.map(card).join('');
  h+='<div class="ft"><p>الذبح والتقطيع والتوصيل متاحة عند الطلب للمناسبات الخاصة فقط. نقطة بيع الأضاحي: أولاد هداج والرغاية. البيع المباشر والإنتاج: السرسو وعين وسارة.</p><a href="https://www.facebook.com/share/14vJ7C9BQ1g/">فيسبوك</a><a href="https://www.tiktok.com/@elinefarmdz">تيك توك</a><a href="https://www.instagram.com/elineframdz">إنستغرام</a><a href="https://maps.app.goo.gl/GBwBt5B86r1sSvvr9">الموقع على الخريطة</a></div>';
  $('#app').innerHTML=h;
}
document.addEventListener('click',e=>{const c=e.target.dataset.c;if(c){cat=c;render()}});
render();
</script>
</body>
</html>
